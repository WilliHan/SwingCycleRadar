[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "swingcycle-radar"
version = "0.1.0"
description = "KRX 기반 절친종목 사이클·진입점수 레이더 (SwingCycle Radar)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mhhan" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "httpx>=0.27",
  "requests>=2.31",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "structlog>=24.1",
  "jinja2>=3.1",
  "supabase>=2.4",
  "streamlit>=1.29",
  "pykrx>=1.0.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[project.scripts]
swingcycle = "swingcycle.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/swingcycle"]
